name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # tags are needed to name the build after the latest release

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK; android-actions/setup-android
      # now fails there trying to install the retired "tools" package.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Every build must carry the same signature and an ever-increasing version code, otherwise
      # Android refuses to install it over the previous one and the user has to uninstall first.
      # Secrets are not available to pull requests from forks; those builds just use the debug key.
      - name: Restore signing key and set the version
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "No signing secrets; using the debug key"
          fi
          TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          # "1.1.0+abc1234" compares equal to 1.1.0, so a test build is never offered a downgrade as an update.
          echo "VERSION_NAME=${TAG#v}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # Exercises R8 and resource shrinking, which the debug build skips. Without
      # signing credentials this produces an unsigned APK, which is fine — the
      # point is to catch release-only breakage here rather than at tag time.
      - name: Build unsigned release APK (verifies minification)
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/devbridge-${GITHUB_SHA::7}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: devbridge-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
